map $http_origin $cors_header {
    default "";
    "http://localhost:5174" $http_origin;
    "https://customer.trustcyprusinsurance.com" $http_origin;
}
server {

    listen 80;
    listen [::]:80;

    server_name asb-tasktracker-emp-rest-api.local;
    root /var/www/asb-rest-api-laravel/public;

    # Add CORS headers globally
    # add_header 'Access-Control-Allow-Origin' $cors_header always;
    # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Preferred-Language,Authorization';
    # add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-XSS-Protection "1; mode=block";
    # add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ .php$ {
        try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/www/asb-rest-api-laravel/storage/logs/laravel_error.log;
    access_log /var/www/asb-rest-api-laravel/storage/logs/laravel_access.log;
}
